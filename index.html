<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พยากรณ์อากาศ กทม.-ปริมณฑล | เลดี้ชฎา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#f6f8ff;--mut:#bcc7ee;--card:rgba(14,20,58,.5);--line:rgba(255,255,255,.18);--gold:#f3c554;--blue:#6cc0ff;--g:linear-gradient(180deg,#143a7a,#2f78c9 55%,#f0a95a);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.s-clear{--g:linear-gradient(180deg,#143a7a,#2f78c9 55%,#f0a95a)}
body.s-cloud{--g:linear-gradient(180deg,#2c3f66,#5d7396 60%,#9aa9c2)}
body.s-rain{--g:linear-gradient(180deg,#171f3d,#2b3962 60%,#43557d)}
body.s-night{--g:linear-gradient(180deg,#0a0924,#1a1550 60%,#36246b)}
@media (prefers-color-scheme:light){
:root:not([data-theme="dark"]) body.s-clear{--g:linear-gradient(180deg,#86cdff,#cdeaff 60%,#ffe6b0);--tx:#10233f;--mut:#3b557d;--card:rgba(255,255,255,.62);--line:rgba(16,35,63,.14);--gold:#a56a00;color-scheme:light}
:root:not([data-theme="dark"]) body.s-cloud{--g:linear-gradient(180deg,#c3d1e6,#e0e8f3 60%,#f4f7fb);--tx:#10233f;--mut:#3b557d;--card:rgba(255,255,255,.62);--line:rgba(16,35,63,.14);--gold:#a56a00;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,sans-serif;color:var(--tx);line-height:1.5;background:#143a7a}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--g);transition:opacity .6s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:12px}
.avatar{width:72px;height:72px;flex:none;border-radius:50%;overflow:hidden;background:#000;border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(243,197,84,.22),0 8px 24px rgba(0,0,0,.35)}
.avatar img{width:150%;max-width:none;margin:-4% 0 0 -26%;display:block}
h1{margin:0;flex:1;font-size:clamp(20px,6vw,27px);line-height:1.15;font-weight:800}
h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin-top:3px}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);font-size:19px;line-height:1;display:grid;place-items:center}
.ib:active{transform:scale(.92)}
.ib.spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.warn{margin-top:12px;padding:10px 14px;border-radius:14px;font-size:13px;background:rgba(255,154,74,.22);border:1px solid rgba(255,154,74,.6)}
.ok{margin-top:12px;font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
.ok i{width:8px;height:8px;border-radius:50%;background:#4fd8a4;box-shadow:0 0 8px #4fd8a4}
.bubble{position:relative;margin-top:14px;padding:12px 16px;font-size:15px;min-height:52px}
.bubble:before{content:"";position:absolute;top:-8px;left:30px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.bubble b{color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold),#ffb36b);color:#2a1a05;border-color:transparent;font-weight:700}
.gl{flex:none;align-self:center;font-size:11px;color:var(--mut);padding:0 2px}
.hero{margin-top:14px;padding:20px 18px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.place{font-size:15px;color:var(--mut)}
.temp{font-size:clamp(72px,24vw,104px);font-weight:800;line-height:1;letter-spacing:-.04em}
.temp sup{font-size:.4em;font-weight:600;vertical-align:top;position:relative;top:.25em}
.big{font-size:clamp(64px,20vw,92px);line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.cond{font-size:20px;font-weight:700;margin-top:4px}
.sub{font-size:13.5px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.st{padding:10px 8px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);text-align:center;font-size:12px;color:var(--mut)}
.st b{display:block;font-size:17px;color:var(--tx)}
.tag{display:inline-block;margin-top:2px;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#10162f}
.sec{margin-top:16px;padding:16px}
.sec h2{margin:0 0 12px;font-size:16px;font-weight:700}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.an{padding:13px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13.5px}
.an h3{margin:0 0 6px;font-size:14px}
.an p{margin:3px 0}.an b{color:var(--gold)}
.an.wide{grid-column:1/-1}
.cw{overflow-x:auto;scrollbar-width:thin}
.cw svg{display:block;min-width:640px;width:100%;height:auto}
.hs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;margin-top:6px}
.hs::-webkit-scrollbar{display:none}
.hc{flex:none;width:74px;padding:10px 4px;border-radius:16px;text-align:center;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12px}
.hc.now{border-color:var(--gold);background:rgba(243,197,84,.18)}
.hc .th{display:block;min-height:34px;line-height:1.25;font-weight:600}
.hc .e{font-size:26px;display:block;margin:2px 0}
.hc b{font-size:17px;display:block}
.hc .rb{height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin:6px 8px 3px;overflow:hidden}
.hc .rb i{display:block;height:100%;background:var(--blue)}
.dr{display:grid;grid-template-columns:78px 34px 44px 1fr 74px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.dr:first-of-type{border-top:0}
.rg{height:6px;border-radius:3px;background:rgba(255,255,255,.15);position:relative}
.rg i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#6cc0ff,#f3c554,#ff7a4a)}
.ov{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.oc{padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);text-align:left;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.oc small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3}
.oc b{font-size:15px;display:block}
.oc em{font-style:normal;font-size:22px;font-weight:800}
footer{margin-top:20px;text-align:center;color:var(--mut);font-size:12px;line-height:1.6}
footer a{color:var(--gold)}
.fade{animation:up .5s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.ans{grid-template-columns:1fr}.dr{grid-template-columns:64px 30px 40px 1fr 66px;font-size:13px}}
</style>
</head>

function chipsR(){const c=$("chips");c.innerHTML="";let g=-1;LOCS.forEach((l,i)=>{if(l.g!==g){g=l.g;const s=document.createElement("span");s.className="gl";s.textContent=g?"ปริมณฑล":"กทม.";c.appendChild(s)}const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=l.n;b.setAttribute("aria-pressed",i===cur);b.onclick=()=>pickLoc(i);c.appendChild(b)})}
function pickLoc(i){if(!DATA)return;SFX.tap();cur=i;store.set("chada-w-l",i);chipsR();render(false);window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
function status(){const t=nowBKK();lastAt=pad(+t.slice(11,13))+":"+t.slice(14,16);$("stat").innerHTML=LIVE?'<div class="ok"><i></i>ข้อมูลสด · อัปเดตล่าสุด '+lastAt+' น. (รีเฟรชอัตโนมัติทุก 10 นาที)</div>':'<div class="warn" role="alert"><b>⚠️ โหมดตัวอย่าง (ไม่ใช่ข้อมูลจริง)</b><br>หน้านี้เชื่อมต่อแหล่งข้อมูลสภาพอากาศสดไม่ได้ ตัวเลขทั้งหมดเป็นข้อมูลจำลองเพื่อดูหน้าตาแอพเท่านั้น ห้ามใช้ตัดสินใจ — นำไฟล์ไปโฮสต์บนเว็บของคุณเองเพื่อใช้ข้อมูลสดจริง</div>'}
let busy=false;
async function load(manual){if(busy)return;busy=true;$("rf").classList.add("spin");if(manual)SFX.go();
try{DATA=await fetchLive();LIVE=true}catch(e){DATA=demo();LIVE=false}
status();render(manual);busy=false;$("rf").classList.remove("spin")}
const sb=$("snd");function sndUI(){sb.textContent=soundOn?"🔊":"🔇";sb.setAttribute("aria-label",soundOn?"ปิดเสียง":"เปิดเสียง")}
sb.onclick=()=>{soundOn=!soundOn;store.set("chada-w-s",soundOn?"1":"0");sndUI();if(soundOn)SFX.tap()};sndUI();
$("rf").onclick=()=>load(true);
const sv=+store.get("chada-w-l");if(Number.isInteger(sv)&&sv>=0&&sv<LOCS.length)cur=sv;
chipsR();load(false);
setInterval(()=>{if(!document.hidden)load(false)},600000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&DATA&&LIVE){const t=nowBKK();if(pad(+t.slice(11,13))+":"+t.slice(14,16)!==lastAt)load(false)}});
</script>
